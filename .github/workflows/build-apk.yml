name: Build APK
run-name: Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID unik dari website"
        required: true
        default: "manual"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Pasang ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Siapkan project (nama, izin, icon, isi web)
        run: python3 .github/scripts/prepare.py

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"

      - name: Upload ke Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_id }}
          target_commitish: ${{ github.sha }}
          name: APK build ${{ inputs.build_id }}
          body: "build_id: ${{ inputs.build_id }}"
          files: ${{ env.APK_FILE }}

      - name: Hapus branch sementara
        if: always() && github.ref_name != github.event.repository.default_branch
        run: git push origin --delete "${{ github.ref_name }}" || true
